name: Build and Distribute APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Distribute APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Run tests
      run: flutter test

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Debug - Check if secrets exist
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        if [ -z "${{ secrets.FIREBASE_APP_ID }}" ]; then
          echo "❌ FIREBASE_APP_ID is not set!"
          exit 1
        else
          echo "✅ FIREBASE_APP_ID is set"
        fi
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
          echo "❌ FIREBASE_SERVICE_ACCOUNT is not set!"
          exit 1
        else
          echo "✅ FIREBASE_SERVICE_ACCOUNT is set"
        fi

    - name: Distribute to Firebase App Distribution
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: wzieba/Firebase-Distribution-Github-Action@v1.7.0
      with:
        appId: 1:977811551855:android:8897af1ee365c44c037f9a
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: testers
        file: build/app/outputs/flutter-apk/app-release.apk
        releaseNotes: |
          🎉 New Build from ${{ github.ref_name }} branch

          📝 Commit: ${{ github.event.head_commit.message }}
          👤 Author: ${{ github.event.head_commit.author.name }}

          ✨ Features in this build:
          - Pet adoption system with adopt/unadopt functionality
          - Full dark/light theme support with toggle button
          - Performance optimizations (60 FPS, 21% less memory)
          - Fixed navigation issues
          - Updated UI and user experience

          🐛 Please test and report any issues!
